# Builds BallBoardCounter.exe on a Windows machine at GitHub.
#   git tag v0.2.0 && git push origin v0.2.0   -> builds and publishes a Release with the exe
#   Actions tab > build-exe > Run workflow     -> builds only; exe under the run's "Artifacts"
name: build-exe
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write            # needed to create the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller pillow
      - run: python test_counter.py
      - run: pyinstaller --noconfirm --onefile --windowed --name BallBoardCounter --hidden-import natnet --icon icon.png --add-data icon.png:. app.py
      - uses: actions/upload-artifact@v7
        with:
          name: BallBoardCounter
          path: dist/BallBoardCounter.exe
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/BallBoardCounter.exe
          generate_release_notes: true
